[project]
name = "nexusagent-api"
version = "0.3.0"
description = "NexusAgent: enterprise knowledge agent platform (MVP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "langgraph>=0.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Heavy clients for the v0.2 backends; local mode needs neither.
stores = ["pymilvus>=2.4", "neo4j>=5.20"]
# Embedded Milvus (file-backed, no server) for local integration runs.
stores-lite = ["pymilvus>=2.4", "milvus-lite>=2.4"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# FastAPI injects dependencies via default arguments by design.
ignore = ["B008"]

[tool.setuptools]
packages = ["app", "app.api", "app.api.routes", "app.agent", "app.core", "app.db", "app.eval", "app.guard", "app.rag", "app.rag.stores", "app.services", "app.streaming"]
include-package-data = false
