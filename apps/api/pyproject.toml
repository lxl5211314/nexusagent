[project]
name = "nexusagent-api"
version = "0.4.0"
description = "NexusAgent: enterprise knowledge agent platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "langgraph>=0.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Heavy clients for the external backends; local mode needs neither.
stores = ["pymilvus>=2.4", "neo4j>=5.20"]
# Embedded Milvus (file-backed, no server) for local integration runs.
stores-lite = ["pymilvus>=2.4", "milvus-lite>=2.4"]
# Multi-instance event fan-out (see app/streaming/bus.py).
events = ["redis>=5.0"]
# Same models, different engine: set NEXUS_DATABASE_URL to a postgresql+psycopg URL.
postgres = ["psycopg[binary]>=3.1"]
# MinIO / S3 storage for the uploaded originals (object_backend=s3).
objects = ["boto3>=1.34"]
# The SkyWalking Python agent; run the API with `sw-python run uvicorn app.main:app`.
apm = ["apache-skywalking>=0.8"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "fakeredis>=2.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# FastAPI injects dependencies via default arguments by design.
ignore = ["B008"]

[tool.setuptools]
packages = ["app", "app.api", "app.api.routes", "app.agent", "app.cache", "app.core", "app.db", "app.eval", "app.guard", "app.mcp", "app.rag", "app.rag.stores", "app.services", "app.storage", "app.streaming"]
include-package-data = false
